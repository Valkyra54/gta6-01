<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DERMAGA EMAS — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7c9a0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); }
  .panel { position: absolute; background: rgba(12, 16, 24, .55); border-radius: 10px; padding: 10px 14px; }
  #mission-panel { top: 24px; left: 24px; min-width: 300px; }
  #mission-title { font-size: 20px; font-weight: 800; letter-spacing: .06em; color: #ffd166; }
  #mission-objective { font-size: 20px; margin-top: 2px; }
  #mission-stage { font-size: 18px; margin-top: 2px; color: #cfe3ff; }
  #wanted { top: 24px; right: 24px; text-align: right; }
  #stars { font-size: 30px; letter-spacing: .12em; color: #ffd166; line-height: 1; }
  #stars.blink { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #stars.near { color: #ff2e2e; }
  #stars.hollow { color: rgba(255,255,255,.45); }
  #desc { font-size: 16px; color: #ffd166; white-space: pre-line; margin-top: 6px; line-height: 1.35; }
  #health { font-size: 18px; font-weight: 800; color: #ff8a8a; margin-top: 2px; }
  #cash { font-size: 26px; font-weight: 800; margin-top: 4px; }
  #clock { font-size: 20px; color: #ffe9c9; margin-top: 2px; }
  #minimap-wrap { position: absolute; left: 24px; bottom: 24px; width: 220px; height: 220px; }
  #minimap { width: 220px; height: 220px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); box-shadow: 0 2px 10px rgba(0,0,0,.4); background: #0e4d5c; }
  #minimap-n { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800; color: #fff; }
  #speed-panel { position: absolute; right: 24px; bottom: 24px; text-align: right; }
  #radio { font-size: 20px; color: #ffe9c9; }
  #speed { font-size: 64px; font-weight: 800; line-height: 1; color: #fff; }
  #speed-unit { font-size: 20px; color: #ffe9c9; }
  #nitro-label { font-size: 18px; letter-spacing: .2em; color: #ffd166; margin-top: 2px; }
  #nitro-bar { width: 180px; height: 10px; margin-left: auto; margin-top: 4px; border-radius: 5px; background: rgba(255,255,255,.25); overflow: hidden; }
  #nitro-fill { width: 100%; height: 100%; background: #ff2e63; }
  #dialog { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 620px; font-size: 20px; background: rgba(12,16,24,.6); border-radius: 8px; padding: 8px 16px; }
  #prompt { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); font-size: 18px; color: #ffe9c9; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(20,10,20,.45), rgba(20,10,20,.72)); color: #fff; pointer-events: none; }
  .overlay h1 { font-size: 96px; margin: 0; letter-spacing: .08em; color: #ffd166; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  .overlay .sub { font-size: 24px; letter-spacing: .22em; color: #ffe9c9; margin-top: 6px; }
  .overlay .tagline { font-size: 22px; font-style: italic; color: #fff; margin-top: 22px; max-width: 760px; }
  .overlay .mission { font-size: 22px; font-weight: 700; color: #ffd166; margin-top: 18px; }
  .overlay .controls { font-size: 21px; color: #eef1f5; margin-top: 18px; }
  .overlay .start { font-size: 24px; font-weight: 700; color: #fff; margin-top: 26px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  #pause-screen h1 { font-size: 64px; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="DERMAGA EMAS: drive the pink KOMODO GT through a golden-hour coastal city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <div id="mission-panel" class="panel">
    <div id="mission-title">MISSION 1 / 3</div>
    <div id="mission-objective">Selamat Datang</div>
    <div id="mission-stage">STAGE 1 / 3</div>
  </div>
  <div id="wanted" class="panel">
    <div id="stars">☆☆☆</div>
    <div id="desc"></div>
    <div id="health"></div>
    <div id="cash">$1,250</div>
    <div id="clock">HARI 1 · 17:30</div>
  </div>
  <div id="minimap-wrap"><canvas id="minimap" width="220" height="220"></canvas><div id="minimap-n">N</div></div>
  <div id="speed-panel">
    <div id="radio">♪ OMBAY 92.5</div>
    <div><span id="speed">0</span> <span id="speed-unit">KM/H</span></div>
    <div id="nitro-label">NITRO</div>
    <div id="nitro-bar"><div id="nitro-fill"></div></div>
  </div>
  <div id="dialog">RINA — WHEELWOMAN</div>
  <div id="prompt">WASD drive · SPACE handbrake · P pause</div>
</div>
<div id="title-screen" class="overlay">
  <h1 id="title-name">DERMAGA EMAS</h1>
  <div id="title-sub" class="sub">GOLDEN WHARF · AN OPEN-WORLD CRIME GAME</div>
  <div id="title-tagline" class="tagline"></div>
  <div id="title-mission" class="mission">MISSION 1 / 3 — Selamat Datang</div>
  <div id="title-controls" class="controls"></div>
  <div id="title-start" class="start">Press SPACE or click to start</div>
</div>
<div id="pause-screen" class="overlay" style="display:none">
  <h1>PAUSED</h1>
  <div id="pause-controls" class="controls"></div>
  <div class="start">Press P to resume</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
